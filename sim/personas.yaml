# Buyer personas.
#
# The simulation needs varied, realistic buyers or the numbers mean nothing.
#
# ON THE DISTRIBUTION, stated up front because a judge who suspects the
# population was engineered will discount everything:
#
# `p_tight_budget` and `p_narrow_category` are the personas that make a blind
# upsell look bad — one has almost no headroom, the other has scope a blind
# recommender will step outside. They are 2 of 10 personas and `weight` gives
# them 18% of sessions between them. That is deliberately a *minority*. If they
# were half the population the result would be an artefact of the population
# rather than a property of the mechanism.
#
# The weights are meant to look like a real merchant's mix: mostly ordinary
# office restocking, a long tail of constrained buyers. They are a guess, and
# `sim/run.py --uniform` reruns with every persona equally likely so the
# sensitivity of the result to this guess is reportable rather than hidden.

personas:
  - id: p_office_manager
    goal: restock office supplies for the month
    weight: 0.20
    basket_size: 2
    addon_receptivity: 0.55
    step_up_approval: 0.85
    mandate:
      max_total_paise: 1500000
      max_per_txn_paise: 500000
      max_count: 5
      categories: [stationery, office_furniture, cables]

  - id: p_tight_budget
    goal: cheapest working setup for one new desk
    weight: 0.10
    basket_size: 1
    addon_receptivity: 0.15
    step_up_approval: 0.40
    note: >
      Headroom is nearly zero after the first purchase, so a naive upsell offers
      things the gate then rejects. A real and common buyer, not a straw man.
    mandate:
      max_total_paise: 400000
      max_per_txn_paise: 400000
      max_count: 1
      categories: [stationery, cables]

  - id: p_broad_scope
    goal: kit out a new hire
    weight: 0.15
    basket_size: 3
    addon_receptivity: 0.70
    step_up_approval: 0.90
    mandate:
      max_total_paise: 3000000
      max_per_txn_paise: 1500000
      max_count: 8
      categories: [stationery, office_furniture, cables]

  - id: p_narrow_category
    goal: buy cables only
    weight: 0.08
    basket_size: 2
    addon_receptivity: 0.45
    step_up_approval: 0.70
    note: >
      A blind upsell offers furniture, the gate rejects it, and the session
      dies. The headroom-aware merchant never makes the offer.
    mandate:
      max_total_paise: 900000
      max_per_txn_paise: 500000
      max_count: 3
      categories: [cables]

  - id: p_stationery_bulk
    goal: bulk notebooks and pens for the team
    weight: 0.14
    basket_size: 2
    addon_receptivity: 0.50
    step_up_approval: 0.80
    mandate:
      max_total_paise: 800000
      max_per_txn_paise: 300000
      max_count: 4
      categories: [stationery]

  - id: p_single_purchase
    goal: one ergonomic chair
    weight: 0.08
    basket_size: 1
    addon_receptivity: 0.30
    step_up_approval: 0.75
    note: >
      One expensive item against a single-purchase mandate. Any addon pushes
      the combined total over the per-transaction cap.
    mandate:
      max_total_paise: 1500000
      max_per_txn_paise: 1400000
      max_count: 1
      categories: [office_furniture]

  - id: p_cable_replacement
    goal: replace broken usb-c and hdmi cables
    weight: 0.10
    basket_size: 2
    addon_receptivity: 0.40
    step_up_approval: 0.80
    mandate:
      max_total_paise: 600000
      max_per_txn_paise: 300000
      max_count: 3
      categories: [cables]

  - id: p_desk_refresh
    goal: refresh two desks with lamps and mats
    weight: 0.07
    basket_size: 2
    addon_receptivity: 0.65
    step_up_approval: 0.85
    mandate:
      max_total_paise: 1200000
      max_per_txn_paise: 600000
      max_count: 4
      categories: [office_furniture, cables]

  - id: p_cautious_approver
    goal: order supplies but check with me on anything unusual
    weight: 0.05
    basket_size: 2
    addon_receptivity: 0.35
    step_up_approval: 0.35
    note: >
      Rarely approves a step up. Present so the step-up recovery rate is not
      measured against a population that always says yes.
    mandate:
      max_total_paise: 700000
      max_per_txn_paise: 250000
      max_count: 4
      categories: [stationery, cables]

  - id: p_generous_scope
    goal: everything needed for a new office
    weight: 0.03
    basket_size: 3
    addon_receptivity: 0.75
    step_up_approval: 0.95
    mandate:
      max_total_paise: 5000000
      max_per_txn_paise: 2000000
      max_count: 10
      categories: [stationery, office_furniture, cables]
