# Event two: UPI / agent-protocol framing. Same core, simulated rail.
#
# The engine, the merchant, the simulation and the attacks do not change between
# events. Every rerun makes them more solid.
rail: mock_upi
merchant_name: DeskKit
merchant_vpa: deskkit@okaxis
surfaces: [grant, gate_console]

beats:
  "1": happy path, agent buys end to end
  "2": headroom upsell, offer made and accepted
  "3": naive upsell for contrast, offer rejected by the gate
  "4": attacks, rapid fire
  "5": forced stockout, refund, budget released, alternative accepted
  "6": duplicate callback arrives, nothing happens

framing:
  opening: A delegation an agent can carry, and a merchant that can read it.
